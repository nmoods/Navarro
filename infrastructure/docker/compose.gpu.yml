# NVIDIA GPU override for the full profile (requires the NVIDIA Container Toolkit).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
  comfyui:
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "--disable-auto-launch"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]
